services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: payment_gateway
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://pg:pg@db:5432/payment_gateway?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports: ["8080:8080"]

volumes:
  pgdata:
